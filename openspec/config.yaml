schema: spec-driven

context: |
  This repository publishes Dev Container Templates through GHCR.
  Write artifacts in English using the template's structural headings.
  Read .agents/knowledge/spec-workflow.md before preparing, applying, syncing,
  or archiving a change. Specifications own template behavior; Issues own status.
  Every src/ or test/ PR includes an added or modified spec.md, with no small-change
  exemption. Only PRs touching neither directory may omit specification changes.
  Small management, harness, knowledge, and dependency updates may use PR discussion
  without specs when consistent with existing contracts. Maintainers must add
  spec:approved to approve a specification package. Agents wait for approval and
  that label before tasks or implementation; GitHub does not enforce the label
  as a required merge check. Humans authorize archive in the final PR into main.

rules:
  proposal:
    - State the user-visible behavior and link any related Issue.
  design:
    - Record approach and trust boundaries without an implementation task list.
  tasks:
    - Create tasks only after the maintainer has approved the proposal, design,
      and delta specs and added spec:approved under the repository contract.
operations:
  apply:
    guidance:
      - Check maintainer approval and the spec:approved label before implementation.
  archive:
    guidance:
      - Archive in the final PR into main only after explicit maintainer completion
        and archive instructions.
