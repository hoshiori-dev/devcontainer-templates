name: Set up policy Deno
description: Install the Deno version owned by tools.json
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: |
        node - <<'JS'
        const fs = require('node:fs');
        const { deno } = JSON.parse(fs.readFileSync('tools.json', 'utf8'));
        if (!/^[0-9.]+$/.test(deno)) throw new Error('Invalid Deno version');
        fs.appendFileSync(process.env.GITHUB_OUTPUT, `deno=${deno}\n`);
        JS
    - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      with:
        deno-version: ${{ steps.version.outputs.deno }}
