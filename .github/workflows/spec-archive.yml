name: Specification archive check
on:
  pull_request_target:
    types: [
      opened,
      synchronize,
      reopened,
      edited,
    ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  archive-verdict:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      # Load only default-branch code. PR content is API data.
      # Explicit check-runs target the PR head SHA rather than the base event SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
      - env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/github.ts archive-check
