name: Specification archive check
on:
  pull_request_target:
    types: [
      opened,
      synchronize,
      reopened,
      edited,
      ready_for_review,
      converted_to_draft,
    ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  policy-dispatch:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      # Load only default-branch code. PR content is API data.
      # Explicit check-runs target the PR head SHA rather than the base event SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
      - env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/github.ts archive-check
