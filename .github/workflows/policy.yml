name: Trusted pull request policy
on:
  pull_request_target:
    types: [
      opened,
      synchronize,
      reopened,
      edited,
      ready_for_review,
      converted_to_draft,
      labeled,
      unlabeled,
    ]
  workflow_run:
    workflows: [Record human specification approval]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: "${{ github.workflow }}-${{ github.event.workflow_run.display_title || format('Specification approval #{0}', github.event.pull_request.number) }}"
  cancel-in-progress: false
jobs:
  policy-dispatch:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: write
    steps:
      # Both triggers load only default-branch policy. PR content is API data.
      # Explicit check-runs target the PR head SHA rather than the base event SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/setup-deno
      - env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/github.ts protected-policy
